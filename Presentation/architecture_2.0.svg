<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="100%" height="100%">
  <defs>
    <style>
      .layer-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #e6edf3; font-weight: 600; }
      .node-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11.5px; fill: #f0f6fc; font-weight: 500; }
      .node-subtext { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9.5px; fill: #e2e8f0; }
      .bullet-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: #cbd5e1; }
      .arrow { stroke: #388bfd; stroke-width: 1.8; fill: none; }
      .arrow-head { fill: #388bfd; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" class="arrow-head" />
    </marker>
    <linearGradient id="dbGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#0d419d"/>
    </linearGradient>
  </defs>

  <!-- 100% Transparent Background - NO background rects -->

  <!-- Train Graphic Outside Top Left of Data Layer -->
  <text x="220" y="90" font-size="20">🚋 🚆 🚂</text>

  <!-- 1. Data & Ingestion Layer (fill="none") -->
  <g id="layer-data">
    <rect x="310" y="25" width="480" height="200" rx="3" fill="none" stroke="#8b949e" stroke-width="1.2"/>
    <text x="325" y="48" class="layer-title">Data &amp; Ingestion Layer</text>
    
    <!-- COA Feed Node -->
    <rect x="325" y="65" width="215" height="44" rx="4" fill="#0b1329" stroke="#388bfd" stroke-width="1.5"/>
    <text x="340" y="92" class="node-text">📊 COA Real-Time Train Feed</text>

    <!-- TMS Node -->
    <rect x="560" y="65" width="215" height="44" rx="4" fill="#0b1329" stroke="#388bfd" stroke-width="1.5"/>
    <text x="575" y="92" class="node-text">⚙️ TMS / SMMS / TDMS Task APIs</text>

    <!-- Database Cylinder Node -->
    <rect x="420" y="140" width="260" height="60" rx="15" fill="url(#dbGrad)" stroke="#58a6ff" stroke-width="2"/>
    <text x="440" y="170" font-size="18">🪶</text>
    <text x="475" y="167" class="node-text" font-weight="700" fill="#ffffff">SQLite / PostgreSQL</text>
    <text x="475" y="183" class="node-subtext">(WAL Mode Enabled)</text>
    <text x="645" y="172" font-size="18">🐘</text>
  </g>

  <!-- 2. FastAPI Service Layer (fill="none") -->
  <g id="layer-fastapi">
    <rect x="450" y="280" width="420" height="175" rx="3" fill="none" stroke="#8b949e" stroke-width="1.2"/>
    <text x="465" y="303" class="layer-title">FastAPI Service Layer</text>

    <!-- FastAPI Node -->
    <rect x="470" y="315" width="200" height="40" rx="4" fill="#04260f" stroke="#238636" stroke-width="1.8"/>
    <text x="485" y="340" class="node-text" fill="#ffffff">⚡ FastAPI Async REST API</text>

    <!-- Scorer Node -->
    <rect x="520" y="375" width="150" height="42" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <text x="535" y="401" class="node-text">Priority Scorer Engine</text>

    <!-- Conflict Detector Node -->
    <rect x="685" y="375" width="170" height="42" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <text x="695" y="401" class="node-text">Spatial-Temporal Conflict Detector</text>
  </g>

  <!-- 3. Presentation & Dispatch Layer (fill="none") -->
  <g id="layer-presentation">
    <rect x="20" y="480" width="590" height="90" rx="3" fill="none" stroke="#8b949e" stroke-width="1.2"/>
    <text x="35" y="503" class="layer-title">Presentation &amp; Dispatch Layer</text>

    <!-- D3 Node -->
    <rect x="32" y="515" width="175" height="42" rx="4" fill="#0f172a" stroke="#f78166" stroke-width="1.5"/>
    <text x="42" y="541" class="node-text">🟠 D3.js Stringline (Marey) Chart</text>

    <!-- Calendar Node -->
    <rect x="217" y="515" width="185" height="42" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <text x="227" y="541" class="node-text">📅 Weekly Block Calendar &amp; Gantt</text>

    <!-- PTW Node -->
    <rect x="412" y="515" width="190" height="42" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <text x="422" y="541" class="node-text">📄 Auto-Generated Form 351 PTW Notice</text>
  </g>

  <!-- 4. Constraint Programming Engine (fill="none") -->
  <g id="layer-engine">
    <rect x="630" y="480" width="440" height="145" rx="3" fill="none" stroke="#8b949e" stroke-width="1.2"/>
    <text x="645" y="503" class="layer-title">Constraint Programming Engine</text>

    <!-- CP-SAT Solver Node -->
    <rect x="685" y="510" width="330" height="38" rx="4" fill="#0f172a" stroke="#388bfd" stroke-width="1.8"/>
    <text x="735" y="534" class="node-text" fill="#58a6ff" font-weight="600">🧩 Google OR-Tools CP-SAT Solver</text>

    <!-- Hard Constraints Node -->
    <rect x="645" y="558" width="195" height="55" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <text x="655" y="575" class="bullet-text" fill="#58a6ff" font-weight="600">Hard Constraints Validator</text>
    <text x="655" y="590" class="bullet-text">• NoOverlap (Machines &amp; Tracks)</text>
    <text x="655" y="605" class="bullet-text" fill="#3fb950" font-weight="600">• Zero Train-Block Collision</text>

    <!-- Soft Constraints Node -->
    <rect x="860" y="558" width="195" height="55" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <text x="870" y="575" class="bullet-text" fill="#d2a8ff" font-weight="600">Soft Constraints &amp; Objective</text>
    <text x="870" y="590" class="bullet-text">• Maximize High-Priority Completion</text>
    <text x="870" y="605" class="bullet-text">• Shadow Block Bonus</text>
  </g>

  <!-- Connectors -->
  <g class="arrows">
    <path d="M 432 109 L 432 125 L 550 125 L 550 138" class="arrow" marker-end="url(#arrow)"/>
    <path d="M 667 109 L 667 125 L 550 125 L 550 138" class="arrow" marker-end="url(#arrow)"/>
    <path d="M 550 200 L 550 315 L 470 315" class="arrow" marker-end="url(#arrow)"/>
    <path d="M 570 355 L 570 375 L 595 375" class="arrow" marker-end="url(#arrow)"/>
    <path d="M 570 355 L 570 375 L 755 375" class="arrow" marker-end="url(#arrow)"/>
    <path d="M 470 335 L 110 335 L 110 513" class="arrow" marker-end="url(#arrow)"/>
    <path d="M 470 335 L 305 335 L 305 513" class="arrow" marker-end="url(#arrow)"/>
    <path d="M 505 355 L 505 513" class="arrow" marker-end="url(#arrow)"/>
    <path d="M 770 417 L 770 508" class="arrow" marker-end="url(#arrow)"/>
    <path d="M 595 417 L 595 450 L 770 450" class="arrow" marker-end="url(#arrow)"/>
    <path d="M 742 548 L 742 556" class="arrow" marker-end="url(#arrow)"/>
    <path d="M 957 548 L 957 556" class="arrow" marker-end="url(#arrow)"/>
    <path d="M 645 565 L 305 565 L 305 558" class="arrow" marker-end="url(#arrow)"/>
    <path d="M 950 558 L 1050 558 L 1050 250 L 590 250 L 590 280" class="arrow" marker-end="url(#arrow)"/>
  </g>
</svg>
